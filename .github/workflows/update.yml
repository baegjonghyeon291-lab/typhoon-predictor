name: 태풍 예측 갱신

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # GFS 분석장 하루 평균 캐시(data/env/gfs, git에 없음). 매번 새 키로 저장하고 가장 최근 것을 복원
      - uses: actions/cache@v4
        with:
          path: |
            data/env/gfs
            data/env/gfs_fc
            data/env/gefs
          key: gfs-${{ github.run_id }}
          restore-keys: gfs-
      # GEFS는 발표당 약 10MB라 지금 쓰는 발표만 남긴다
      - run: if [ -d data/env/gefs ]; then find data/env/gefs -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} +; fi
      - run: python -m typhoon.export --update
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}   # 없으면 기상청 예보만 빠진다
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/stats.json data/forecast_log.jsonl
          git diff --cached --quiet || (git commit -m "예측 데이터 갱신" && git push)
